<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>Lapline, settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E1626}
a{color:#F2EBDD}a:hover{color:#FFFFFF}
button,input{font:inherit;color:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #0E1626; color: #F2EBDD; font-family: 'Barlow Semi Condensed', sans-serif; font-variant-numeric: tabular-nums; overflow: hidden">

  <header style="height: 60px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 8px 0 16px; border-bottom: 1px solid #283857">
    <h1 style="margin: 0; font-size: 24px; font-weight: 600">Settings</h1>
    <button style="height: 44px; padding: 0 12px; border: 0; background: none; font-size: 18px; font-weight: 600">Done</button>
  </header>

  <div style="flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: 22px; padding: 16px 16px 0">

    <section aria-labelledby="sessHead" style="display: flex; flex-direction: column; gap: 8px">
      <h2 id="sessHead" style="margin: 0; font-size: 16px; font-weight: 600; color: #8C9AB5">Harbourfront Grand Prix, this weekend</h2>
      <div role="radiogroup" aria-labelledby="sessHead" style="display: flex; flex-direction: column; border-radius: 14px; background: #15213A; border: 1px solid #283857; overflow: hidden">
        <sc-for list="{{sessions}}" as="s" hint-placeholder-count="5">
          <label style="min-height: 50px; display: flex; align-items: center; gap: 12px; padding: 0 14px; border-bottom: 1px solid #283857; font-size: 18px">
            <input type="radio" name="session" checked="{{s.on}}" style="width: 20px; height: 20px; accent-color: #F2EBDD; margin: 0">
            <span style="flex: 1">{{s.name}}</span>
            <span style="font-size: 15px; color: {{s.metaCol}}">{{s.meta}}</span>
          </label>
        </sc-for>
      </div>
      <button style="align-self: flex-start; height: 44px; padding: 0; border: 0; background: none; font-size: 16px; color: #F2EBDD; text-decoration: underline; text-underline-offset: 4px">Earlier weekends</button>
    </section>

    <section aria-label="Watching" style="display: flex; flex-direction: column; border-radius: 14px; background: #15213A; border: 1px solid #283857; overflow: hidden">
      <label style="min-height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 14px; border-bottom: 1px solid #283857">
        <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 18px">Jump to live sessions</span><span style="font-size: 14px; color: #8C9AB5">Switch automatically when a session starts</span></span>
        <input type="checkbox" checked style="width: 22px; height: 22px; accent-color: #2BB673; margin: 0">
      </label>
      <label style="min-height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 14px; border-bottom: 1px solid #283857">
        <span style="flex: 1; font-size: 18px">Keep the screen on</span>
        <input type="checkbox" checked style="width: 22px; height: 22px; accent-color: #2BB673; margin: 0">
      </label>
      <label style="min-height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 14px">
        <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 18px">Label every car</span><span style="font-size: 14px; color: #8C9AB5">Off shows the leader, your driver and close battles</span></span>
        <input type="checkbox" style="width: 22px; height: 22px; accent-color: #2BB673; margin: 0">
      </label>
    </section>

    <section aria-label="Track view" style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 14px; background: #15213A; border: 1px solid #283857">
      <label for="elev" style="display: flex; justify-content: space-between; font-size: 18px"><span>Elevation</span><span style="color: #8C9AB5">4× exaggerated</span></label>
      <input id="elev" type="range" min="1" max="12" value="4" style="accent-color: #F2EBDD; margin: 0; height: 28px">
      <span style="font-size: 14px; color: #8C9AB5; line-height: 1.4">Street circuits are almost flat, so the height of the track is stretched to make it readable when rotated.</span>
    </section>

    <button style="height: 50px; border-radius: 14px; border: 1px solid #283857; background: #15213A; font-size: 18px">Replay this race from the start</button>

    <p style="margin: 0; font-size: 14px; line-height: 1.45; color: #8C9AB5">Live stream healthy, data 3 s behind real time. OpenF1 sponsor access, 1,240 requests this session.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = (name, meta, on, live) => ({ name, meta, on, metaCol: live ? '#E5383B' : '#8C9AB5' });
    return {
      sessions: [
        s('Race', 'Live now', true, true),
        s('Qualifying', 'Sat 9 pm', false),
        s('Sprint', 'Sat 5 pm', false),
        s('Sprint qualifying', 'Fri 8:30 pm', false),
        s('Practice 1', 'Fri 4:30 pm', false),
      ],
    };
  }
}
</script>
</body>
</html>
