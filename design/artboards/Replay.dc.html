<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>Lapline, replay</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E1626}
a{color:#F2EBDD}a:hover{color:#FFFFFF}
button{font:inherit;color:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #0E1626; color: #F2EBDD; font-family: 'Barlow Semi Condensed', sans-serif; font-variant-numeric: tabular-nums; overflow: hidden">

  <div role="status" aria-label="Track green" style="height: 4px; background: #2BB673; flex: none"></div>

  <header style="height: 56px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 4px 0 16px; gap: 8px">
    <div style="display: flex; align-items: baseline; gap: 8px">
      <span style="font-size: 21px; font-weight: 600">Harbourfront</span>
      <span style="font-size: 17px; color: #8C9AB5">Lap <b style="color: #F2EBDD; font-weight: 600">23</b>/62</span>
    </div>
    <div style="display: flex; align-items: center; gap: 2px">
      <span style="display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 15px; border: 1px solid #283857; font-size: 15px; color: #C9D1DE">
        <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5" fill="none" stroke="#C9D1DE" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Replay
      </span>
      <button aria-label="Settings" style="width: 44px; height: 44px; display: grid; place-items: center; background: none; border: 0">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="#F2EBDD" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      </button>
    </div>
  </header>

  <section aria-label="Track" style="position: relative; height: 290px; flex: none">
    <svg width="390" height="290" viewBox="0 0 390 290" role="img" aria-label="3D track view with cars" style="position: absolute; inset: 0">
      <path d="{{track}}" fill="none" stroke="#F2EBDD" stroke-width="11" stroke-linejoin="round" opacity="0.1"/>
      <path d="{{track}}" fill="none" stroke="#F2EBDD" stroke-width="3.4" stroke-linejoin="round"/>
    </svg>
    <svg width="390" height="290" viewBox="0 0 390 290" aria-hidden="true" style="position: absolute; inset: 0">
      <path d="M281 158L286 156L292 155L298 153L304 152L310 150L316 148L322 145L329 143L334 140L340 136L345 133L349 130L352 126L354 123L355 121L356 119L356 117L355 116L354 115L352 113" fill="none" stroke="#8C9AB5" stroke-width="1.6" stroke-dasharray="3 3"/>
      <text x="300" y="143" fill="#8C9AB5" font-size="12" font-family="Barlow Semi Condensed, sans-serif">Pit lane</text>
      <path d="M361 122L367 125M352 106L355 100M315 96L317 89M276 88L278 81M244 80L245 73M210 77L210 70M172 80L171 74M140 88L138 81M116 98L113 92M91 108L89 102M69 115L66 109M58 123L52 120M53 137L47 135M40 156L35 152M21 178L15 174M22 204L16 207M59 226L57 232M117 226L118 233M168 213L170 219M204 203L205 209M231 195L233 202M251 182L255 187M270 168L273 174M299 159L301 165M337 144L340 151" stroke="#8C9AB5" stroke-width="1" opacity="0.45"/>
      <path d="M80 115L76 102M144 217L148 230" stroke="#F2EBDD" stroke-width="2.2" stroke-linecap="round"/>
      <text x="83" y="131" fill="#C9D1DE" font-size="12" font-weight="600" font-family="Barlow Semi Condensed, sans-serif">S2</text>
      <text x="133" y="210" fill="#C9D1DE" font-size="12" font-weight="600" font-family="Barlow Semi Condensed, sans-serif">S3</text>
      <path d="M294 96L297 82" stroke="#8C9AB5" stroke-width="1.6" stroke-linecap="round"/>
      <text x="300" y="80" fill="#8C9AB5" font-size="12" font-family="Barlow Semi Condensed, sans-serif">Speed trap</text>
      <path d="M350 130L360 142" stroke="#0E1626" stroke-width="4"/>
      <path d="M350 130L360 142" stroke="#F2EBDD" stroke-width="4" stroke-dasharray="2 2"/>
      <text x="363" y="154" fill="#C9D1DE" font-size="11" font-weight="600" font-family="Barlow Semi Condensed, sans-serif">S1</text>
      <path d="M338 84l-8 3 8 4z" fill="#8C9AB5"/>
    </svg>
    <sc-for list="{{turns}}" as="tn" hint-placeholder-count="9">
      <span style="position: absolute; left: {{tn.l}}px; top: {{tn.t}}px; width: 17px; height: 17px; box-sizing: border-box; border-radius: 50%; border: 1px solid #3A4D74; background: #15213A; color: #C9D1DE; font-size: 10px; font-weight: 700; display: grid; place-items: center">{{tn.n}}</span>
    </sc-for>
    <sc-for list="{{cars}}" as="c" hint-placeholder-count="20">
      <span style="position: absolute; left: {{c.l}}px; top: {{c.t}}px; width: 10px; height: 10px; border-radius: 50%; background: {{c.col}}; box-shadow: 0 0 0 1.5px #0E1626"></span>
    </sc-for>
    <span aria-hidden="true" style="position: absolute; left: 146px; top: 72px; width: 16px; height: 16px; border-radius: 50%; border: 2px solid #F2EBDD; box-sizing: border-box"></span>
    <span style="position: absolute; left: 98px; top: 66px; padding: 1px 5px; border-radius: 4px; background: rgba(14,22,38,.88); font-size: 13px; font-weight: 700; border-bottom: 2px solid #E8702A">AVA</span>
    <span style="position: absolute; left: 138px; top: 94px; padding: 2px 7px; border-radius: 4px; background: #F2EBDD; color: #0E1626; font-size: 15px; font-weight: 700; border-bottom: 3px solid #E80020">EMI</span>
    <div role="group" aria-label="Camera" style="position: absolute; top: 8px; right: 12px; display: flex; padding: 3px; gap: 2px; border-radius: 12px; background: rgba(21,33,58,.92); border: 1px solid #283857">
      <button style="height: 38px; padding: 0 12px; border: 0; border-radius: 9px; background: none; color: #8C9AB5; font-size: 15px">Map</button>
      <button aria-pressed="true" style="height: 38px; padding: 0 12px; border: 0; border-radius: 9px; background: #F2EBDD; color: #0E1626; font-size: 15px; font-weight: 600">Tilt</button>
      <button style="height: 38px; padding: 0 12px; border: 0; border-radius: 9px; background: none; color: #8C9AB5; font-size: 15px">Chase</button>
    </div>
  </section>

  <section aria-label="Selected driver" style="flex: none; height: 88px; box-sizing: border-box; padding: 10px 4px 10px 16px; background: #15213A; border-top: 1px solid #283857; border-bottom: 1px solid #283857; display: flex; align-items: center; gap: 12px">
    <span style="width: 4px; align-self: stretch; border-radius: 2px; background: #E80020"></span>
    <div style="display: flex; flex-direction: column; gap: 2px; width: 74px">
      <span style="font-size: 15px; color: #8C9AB5">P3</span>
      <span style="font-size: 24px; font-weight: 700; line-height: 1">EMI</span>
      <span style="font-size: 14px; color: #8C9AB5">+0.812</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: flex-end; width: 62px">
      <span style="font-size: 36px; font-weight: 700; line-height: 1">287</span>
      <span style="font-size: 13px; color: #8C9AB5">km/h</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; width: 26px">
      <span style="font-size: 36px; font-weight: 500; line-height: 1">7</span>
      <span style="font-size: 13px; color: #8C9AB5">gear</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 9px; min-width: 0">
      <div aria-label="Throttle 92 percent" style="height: 7px; border-radius: 4px; background: #0E1626; overflow: hidden"><div style="width: 92%; height: 100%; background: #2BB673"></div></div>
      <div aria-label="Brake off" style="height: 7px; border-radius: 4px; background: #0E1626"></div>
      <span style="display: flex; align-items: center; gap: 5px; font-size: 14px; color: #8C9AB5"><span style="width: 18px; height: 18px; box-sizing: border-box; border-radius: 50%; border: 2.5px solid #FFD12E; color: #FFD12E; font-size: 10px; font-weight: 700; display: grid; place-items: center">M</span>15 laps</span>
    </div>
    <button aria-label="Show telemetry" style="width: 44px; height: 44px; display: grid; place-items: center; background: none; border: 0">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6" stroke="#F2EBDD" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </section>

  <section aria-label="Timing" style="flex: 1; min-height: 0; overflow: hidden">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
      <div style="height: 36px; display: grid; grid-template-columns: 26px 4px 1fr 78px 52px 70px; gap: 10px; align-items: center; padding: 0 16px; font-size: 17px; border-bottom: 1px solid rgba(40,56,87,.55); background: {{r.bg}}">
        <span style="text-align: right; color: #8C9AB5">{{r.p}}</span>
        <span style="height: 20px; border-radius: 2px; background: {{r.col}}"></span>
        <span style="font-weight: 700">{{r.code}}</span>
        <span style="justify-self: end; padding: 1px 6px; border-radius: 5px; background: {{r.gapBg}}; color: {{r.gapCol}}">{{r.int}}</span>
        <span style="display: flex; align-items: center; gap: 4px; font-size: 13px; color: #8C9AB5"><span style="width: 19px; height: 19px; box-sizing: border-box; border-radius: 50%; border: 2.5px solid {{r.tc}}; color: {{r.tc}}; font-size: 10px; font-weight: 700; display: grid; place-items: center">{{r.t}}</span>{{r.age}}</span>
        <span style="text-align: right; color: {{r.lc}}">{{r.last}}</span>
      </div>
    </sc-for>
  </section>

  <footer style="flex: none; box-sizing: border-box; padding: 10px 12px 14px 16px; display: flex; flex-direction: column; gap: 6px; background: #15213A; border-top: 1px solid #283857">
    <div aria-label="Replay position, lap 23 of 62. Yellow marks safety car, red marks red flag." style="position: relative; height: 22px">
      <div style="position: absolute; left: 0; right: 0; top: 9px; height: 4px; border-radius: 2px; background: #283857"></div>
      <div style="position: absolute; left: 0; width: 37%; top: 9px; height: 4px; border-radius: 2px; background: #F2EBDD"></div>
      <div style="position: absolute; left: 38.5%; width: 4%; top: 7px; height: 8px; border-radius: 2px; background: #F5B700"></div>
      <div style="position: absolute; left: 50%; width: 3px; top: 3px; height: 16px; border-radius: 1px; background: #E5383B"></div>
      <div style="position: absolute; left: 67%; width: 2.5%; top: 7px; height: 8px; border-radius: 2px; background: #F5B700; opacity: .65"></div>
      <span style="position: absolute; left: calc(37% - 9px); top: 2px; width: 18px; height: 18px; border-radius: 50%; background: #F2EBDD; box-shadow: 0 0 0 3px #15213A"></span>
    </div>
    <div style="display: flex; align-items: center; gap: 6px">
      <button onClick="{{toggle}}" aria-label="{{playLabel}}" style="width: 48px; height: 48px; border-radius: 24px; border: 0; background: #F2EBDD; display: grid; place-items: center">
        <sc-if value="{{playing}}" hint-placeholder-val="{{true}}"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z" fill="#0E1626"/></svg></sc-if>
        <sc-if value="{{paused}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5v14l12-7z" fill="#0E1626"/></svg></sc-if>
      </button>
      <button aria-label="Back 10 seconds" style="width: 44px; height: 44px; border: 0; background: none; font-size: 15px; color: #C9D1DE">−10 s</button>
      <button aria-label="Forward 10 seconds" style="width: 44px; height: 44px; border: 0; background: none; font-size: 15px; color: #C9D1DE">+10 s</button>
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center">
        <span style="font-size: 18px; font-weight: 600">0:38:12</span>
        <span style="font-size: 13px; color: #8C9AB5">of 1:47:13</span>
      </div>
      <button onClick="{{cycle}}" aria-label="Playback speed" style="height: 44px; min-width: 56px; padding: 0 10px; border-radius: 12px; border: 1px solid #283857; background: #0E1626; font-size: 17px; font-weight: 600">{{speed}}×</button>
    </div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { playing: true, speed: 4 };
  }
  renderVals() {
    const tyre = { S: '#FF4D4F', M: '#FFD12E', H: '#F2EBDD' };
    const pos = '139,84 149,82 154,80 165,78 178,76 184,75 197,74 216,74 222,74 234,75 239,76 250,78 277,85 283,86 296,89 302,90 309,91 323,94 330,95 343,99'.split(' ').map((p) => p.split(',').map(Number));
    const order = ['#E8702A','#E8702A','#E80020','#3671C6','#27F4D2','#3671C6','#E80020','#229971','#27F4D2','#FF87BC','#229971','#FF87BC','#64C4FF','#64C4FF','#B6BABD','#52E252','#B6BABD','#6692FF','#52E252','#6692FF'];
    const field = [
      ['AVA', '#E8702A', 'Leader', 'M', 15, '1:42.318'], ['BEN', '#E8702A', '+1.204', 'H', 6, '1:41.902', 'fastest'],
      ['EMI', '#E80020', '+0.812', 'M', 15, '1:42.690'], ['CRU', '#3671C6', '+0.684', 'M', 15, '1:42.551'],
      ['GIO', '#27F4D2', '+2.305', 'H', 6, '1:42.988'], ['DEL', '#3671C6', '+0.433', 'H', 7, '1:42.871', 'pb'],
      ['FIN', '#E80020', '+3.914', 'M', 15, '1:43.201'],
    ];
    const rows = field.map((f, i) => {
      const n = parseFloat(f[2].replace('+', ''));
      const battle = !Number.isNaN(n) && n < 1;
      return { p: i + 1, code: f[0], col: f[1], int: f[2], t: f[3], tc: tyre[f[3]], age: f[4], last: f[5],
        lc: f[6] === 'fastest' ? '#B794FF' : f[6] === 'pb' ? '#4CD08E' : '#8C9AB5',
        gapBg: battle ? '#283857' : 'transparent', gapCol: battle ? '#F2EBDD' : '#C9D1DE', bg: f[0] === 'EMI' ? '#15213A' : 'transparent' };
    });
    const speeds = [1, 2, 4, 8, 16];
    const turns = [[1,374,113],[2,275,70],[3,189,61],[4,102,96],[5,55,103],[6,36,133],[7,9,213],[8,247,207],[9,278,183]].map(([n, x, y]) => ({ n, l: x - 8.5, t: y - 8.5 }));
    return {
      rows, turns,
      cars: pos.map(([x, y], i) => ({ l: x - 5, t: y - 5, col: order[i] })),
      playing: this.state.playing,
      paused: !this.state.playing,
      playLabel: this.state.playing ? 'Pause' : 'Play',
      speed: this.state.speed,
      toggle: () => this.setState({ playing: !this.state.playing }),
      cycle: () => this.setState({ speed: speeds[(speeds.indexOf(this.state.speed) + 1) % speeds.length] }),
      track: 'M355 136L359 132L362 128L364 124L365 120L365 116L363 112L361 109L358 106L353 103L348 101L343 99L336 97L330 95L323 94L316 93L309 91L302 90L296 89L289 88L283 86L277 85L271 83L266 82L260 80L255 79L250 78L244 77L239 76L234 75L228 74L222 74L216 74L210 74L203 74L197 74L191 75L184 75L178 76L171 77L165 78L160 79L154 80L149 82L144 83L139 84L134 86L130 88L126 89L122 91L118 93L114 95L110 97L106 98L102 100L98 102L94 103L90 105L86 106L82 108L78 109L74 110L71 111L67 112L64 113L62 115L60 116L58 118L56 119L55 121L54 123L53 126L52 128L52 131L51 133L50 136L49 139L47 142L45 145L43 148L40 151L37 154L34 157L31 161L27 164L24 168L21 172L18 176L16 181L15 185L14 190L15 195L16 200L19 206L23 210L28 215L34 219L41 223L49 226L58 229L67 231L77 232L87 232L98 232L108 231L118 230L128 228L137 226L146 223L154 221L162 218L169 216L176 214L182 212L188 210L194 209L199 207L204 206L209 205L214 204L219 203L223 201L228 200L232 198L236 197L240 194L243 192L247 190L250 187L253 185L256 182L259 180L262 177L265 175L268 173L272 171L275 169L279 168L284 166L289 165L294 163L300 162L306 160L312 158L319 156L326 154L332 151L339 148L345 144L350 140Z',
    };
  }
}
</script>
</body>
</html>
