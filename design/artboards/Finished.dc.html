<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>Lapline, chequered flag</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E1626}
a{color:#F2EBDD}a:hover{color:#FFFFFF}
button{font:inherit;color:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #0E1626; color: #F2EBDD; font-family: 'Barlow Semi Condensed', sans-serif; font-variant-numeric: tabular-nums; overflow: hidden">

  <div role="status" style="height: 28px; flex: none; display: flex; align-items: center; justify-content: center; gap: 10px; background: #F2EBDD; color: #0E1626; font-size: 16px; font-weight: 700">
    <span aria-hidden="true" style="width: 44px; height: 14px; background: conic-gradient(#0E1626 25%, #F2EBDD 0 50%, #0E1626 0 75%, #F2EBDD 0) 0 0 / 14px 14px"></span>
    Chequered flag
    <span aria-hidden="true" style="width: 44px; height: 14px; background: conic-gradient(#0E1626 25%, #F2EBDD 0 50%, #0E1626 0 75%, #F2EBDD 0) 0 0 / 14px 14px"></span>
  </div>

  <header style="height: 56px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 4px 0 16px; gap: 8px">
    <div style="display: flex; align-items: baseline; gap: 8px">
      <span style="font-size: 21px; font-weight: 600">Harbourfront</span>
      <span style="font-size: 17px; color: #8C9AB5">62 laps</span>
    </div>
    <div style="display: flex; align-items: center; gap: 2px">
      <span style="height: 44px; display: flex; align-items: center; padding: 0 10px; font-size: 16px; color: #8C9AB5">Race finished</span>
      <button aria-label="Settings" style="width: 44px; height: 44px; display: grid; place-items: center; background: none; border: 0">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="#F2EBDD" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      </button>
    </div>
  </header>

  <section aria-label="Podium" style="position: relative; height: 250px; flex: none; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 16px 16px; box-sizing: border-box">
    <svg width="390" height="250" viewBox="0 0 390 290" role="img" aria-label="Track outline" style="position: absolute; inset: 0; opacity: .22">
      <path d="M355 136L365 116L348 101L316 93L283 86L255 79L228 74L197 74L165 78L139 84L118 93L98 102L78 109L62 115L54 123L50 136L40 151L24 168L14 190L28 215L67 231L118 230L162 218L194 209L219 203L240 194L256 182L272 171L294 163L326 154Z" fill="none" stroke="#F2EBDD" stroke-width="3.4" stroke-linejoin="round"/>
    </svg>
    <div style="position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; align-items: end">
      <div style="display: flex; flex-direction: column; gap: 6px; padding: 12px; background: #15213A; border: 1px solid #283857; border-radius: 12px; height: 118px; box-sizing: border-box">
        <span style="font-size: 15px; color: #8C9AB5">Second</span>
        <span style="font-size: 26px; font-weight: 700; border-bottom: 3px solid #E80020; align-self: flex-start">EMI</span>
        <span style="font-size: 15px; color: #C9D1DE">+3.418</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px; padding: 12px; background: #F2EBDD; color: #0E1626; border-radius: 12px; height: 146px; box-sizing: border-box">
        <span style="font-size: 15px; color: #3B4A66">Winner</span>
        <span style="font-size: 30px; font-weight: 700; border-bottom: 3px solid #E8702A; align-self: flex-start">AVA</span>
        <span style="font-size: 15px">1:47:12.904</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px; padding: 12px; background: #15213A; border: 1px solid #283857; border-radius: 12px; height: 104px; box-sizing: border-box">
        <span style="font-size: 15px; color: #8C9AB5">Third</span>
        <span style="font-size: 26px; font-weight: 700; border-bottom: 3px solid #E8702A; align-self: flex-start">BEN</span>
        <span style="font-size: 15px; color: #C9D1DE">+9.061</span>
      </div>
    </div>
  </section>

  <p style="flex: none; margin: 0; padding: 0 16px 10px; font-size: 15px; color: #8C9AB5">Fastest lap <b style="color: #B794FF; font-weight: 600">BEN 1:41.902</b>, lap 23</p>

  <section aria-label="Final classification" style="flex: 1; min-height: 0; overflow: hidden; border-top: 1px solid #283857">
    <div style="height: 30px; display: grid; grid-template-columns: 26px 4px 1fr 92px 46px; gap: 10px; align-items: center; padding: 0 16px; font-size: 14px; color: #8C9AB5; border-bottom: 1px solid #283857">
      <span style="text-align: right">Pos</span><span></span><span>Driver</span><span style="text-align: right">Gap to winner</span><span style="text-align: right">Stops</span>
    </div>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="11">
      <div style="height: 36px; display: grid; grid-template-columns: 26px 4px 1fr 92px 46px; gap: 10px; align-items: center; padding: 0 16px; font-size: 17px; border-bottom: 1px solid rgba(40,56,87,.55); background: {{r.bg}}">
        <span style="text-align: right; color: #8C9AB5">{{r.p}}</span>
        <span style="height: 20px; border-radius: 2px; background: {{r.col}}"></span>
        <span style="font-weight: 700">{{r.code}}</span>
        <span style="text-align: right; color: {{r.gc}}">{{r.gap}}</span>
        <span style="text-align: right; color: #8C9AB5">{{r.stops}}</span>
      </div>
    </sc-for>
  </section>

  <footer style="flex: none; height: 68px; box-sizing: border-box; padding: 0 16px 8px; display: flex; align-items: center; gap: 8px; background: #15213A; border-top: 1px solid #283857">
    <button style="flex: 1; height: 44px; border-radius: 12px; border: 1px solid #283857; background: #0E1626; font-size: 16px">Choose a session</button>
    <button style="flex: 1; height: 44px; border-radius: 12px; border: 0; background: #F2EBDD; color: #0E1626; font-size: 16px; font-weight: 600">Replay the race</button>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const rows = [
      ['AVA', '#E8702A', '1:47:12.904', '2'], ['EMI', '#E80020', '+3.418', '2'], ['BEN', '#E8702A', '+9.061', '2'],
      ['CRU', '#3671C6', '+11.775', '2'], ['GIO', '#27F4D2', '+18.240', '1'], ['DEL', '#3671C6', '+19.006', '1'],
      ['FIN', '#E80020', '+24.513', '2'], ['ISL', '#229971', '+31.882', '1'], ['HUX', '#27F4D2', '+38.130', '2'],
      ['KAI', '#FF87BC', '+1 lap', '2'], ['ORI', '#B6BABD', 'Did not finish', '1'],
    ].map((r, i) => ({ p: r[2] === 'Did not finish' ? '' : i + 1, code: r[0], col: r[1], gap: r[2], stops: r[3], gc: r[2] === 'Did not finish' ? '#8C9AB5' : '#C9D1DE', bg: r[0] === 'EMI' ? '#15213A' : 'transparent' }));
    return { rows };
  }
}
</script>
</body>
</html>
